name: Signed Android release verification
run-name: Alfonso signed build ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Uploaded source commit SHA to build
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify exact source commit
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore existing project signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES: ${{ secrets.ANDROID_SIGNING_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_PROPERTIES"
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/home-sprachsteuerung.jks
          printf '%s' "$SIGNING_PROPERTIES" > signing/signing.properties
      - name: Build and check the uploaded source
        run: |
          bash gradlew --no-daemon assembleDebug assembleRelease bundleRelease testDebugUnitTest lintDebug signingReport
      - name: Validate bundle, APK, original signature and Auto manifest
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          python3 scripts/verify-play-artifacts.py "$RUNNER_TEMP/bundletool.jar" app/build/outputs/bundle/release/app-release.aab app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/PLAY-VERIFICATION.txt
          git rev-parse HEAD >> app/build/outputs/PLAY-VERIFICATION.txt
      - name: Record verification without public binary distribution
        run: cat app/build/outputs/PLAY-VERIFICATION.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing files from runner
        if: always()
        run: rm -f signing/home-sprachsteuerung.jks signing/signing.properties
